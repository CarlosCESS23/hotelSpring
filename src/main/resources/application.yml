spring:
  datasource:
    url: "jdbc:postgresql://localhost:5432/${POST_DB}"
    username: "${POST_USER}"
    password: "${POST_DB}"
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: "org.hibernate.dialect.PostgreSQLDialect"
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true